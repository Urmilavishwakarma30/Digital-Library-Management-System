<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Members - Admin</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="admin-members-page">

        <div class="admin-members-container">

            <h1>Digital Library</h1>
            <h2>Registered Members</h2>

            <div class="table-wrapper">

                <table class="members-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="member : ${members}">

                            <td th:text="${member.id}"></td>

                            <td th:text="${member.name}"></td>

                            <td th:text="${member.email}"></td>

                            <td>
                                <span class="member-role"
                                      th:text="${member.role}">
                                </span>
                            </td>

                            <td>

                                <form th:if="${member.role != 'ADMIN'}"
                                      th:action="@{/admin/members/delete}"
                                      method="post"
                                      onsubmit="return confirm('Are you sure you want to delete this member?');">

                                    <input type="hidden"
                                           name="id"
                                           th:value="${member.id}">

                                    <button type="submit"
                                            class="member-delete-button">
                                        Delete
                                    </button>

                                </form>

                                <span th:if="${member.role == 'ADMIN'}"
                                      class="admin-label">
                                    Admin
                                </span>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(members)}">

                            <td colspan="5" class="empty-message">
                                No registered members found.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

            <div class="admin-members-back">

                <a href="/admin">
                    ← Back to Admin Dashboard
                </a>

            </div>

        </div>

    </div>

</body>
</html>
